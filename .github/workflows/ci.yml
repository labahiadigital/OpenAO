name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-backend:
    name: Backend Rust (check, clippy, test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            game-server-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('game-server-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        working-directory: game-server-rs
        run: cargo check

      - name: Clippy (strict)
        working-directory: game-server-rs
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: game-server-rs
        run: cargo test

      - name: Run crate tests
        working-directory: game-server-rs/crates/protocol
        run: cargo test

  protocol:
    name: Protocol (typecheck, test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/protocol/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/protocol
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/protocol
        run: pnpm typecheck

      - name: Test
        working-directory: packages/protocol
        run: pnpm test

  frontend-svelte:
    name: Frontend SvelteKit (check, test)
    runs-on: ubuntu-latest
    needs: protocol

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-svelte/pnpm-lock.yaml

      - name: Install protocol dependencies
        working-directory: packages/protocol
        run: pnpm install --frozen-lockfile

      - name: Build protocol
        working-directory: packages/protocol
        run: pnpm build

      - name: Install frontend dependencies
        working-directory: frontend-svelte
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        working-directory: frontend-svelte
        run: pnpm check

      - name: Run tests
        working-directory: frontend-svelte
        run: pnpm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [rust-backend, protocol, frontend-svelte]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build game-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./game-server-rs/Dockerfile
          push: false
          tags: openao-server:ci
          load: true

      - name: Verify server starts (health check)
        run: |
          docker run -d --name openao-ci -p 7667:7667 openao-server:ci
          sleep 3
          curl -sf http://localhost:7667/api/health || (docker logs openao-ci && exit 1)
          docker stop openao-ci
