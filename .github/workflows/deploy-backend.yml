name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "game-server-rs/**"
  pull_request:
    paths:
      - "game-server-rs/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            game-server-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('game-server-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: game-server-rs
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: game-server-rs
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: game-server-rs
        run: cargo test

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./game-server-rs
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/game-server:latest
            ghcr.io/${{ github.repository }}/game-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}/game-server:latest
            docker stop openao-server || true
            docker rm openao-server || true
            docker run -d \
              --name openao-server \
              --restart unless-stopped \
              -p 7666:7666 \
              -p 7667:7667 \
              -v openao-data:/data \
              -e BIND_ADDR="0.0.0.0:7666" \
              -e HTTP_ADDR="0.0.0.0:7667" \
              -e DATABASE_URL="sqlite:/data/openao.db" \
              -e RUST_LOG="openao_server=info" \
              ghcr.io/${{ github.repository }}/game-server:latest
