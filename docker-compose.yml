services:
  game-server:
    build:
      context: ./game-server-rs
      dockerfile: Dockerfile
    ports:
      - "7666:7666"
      - "7667:7667"
    environment:
      BIND_ADDR: "0.0.0.0:7666"
      HTTP_ADDR: "0.0.0.0:7667"
      DATABASE_URL: "sqlite:/data/openao.db"
      RUST_LOG: "openao_server=info"
    volumes:
      - gamedata:/data
    restart: unless-stopped

volumes:
  gamedata:
