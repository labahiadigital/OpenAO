[workspace]
members = [".", "crates/protocol"]
resolver = "2"

[package]
name = "openao-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
openao-protocol = { path = "crates/protocol" }
elura = { version = "0.3.1", features = ["simulation", "aoi", "netcode", "replication", "lag-compensation", "room", "net-sim"] }
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
rand = "0.9"
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
argon2 = "0.6.0"
arc-swap = "1.9.2"
smallvec = { version = "1", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
